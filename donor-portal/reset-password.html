<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — Thuvakkam SFS</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="dp-auth-wrap">

  <!-- LEFT PANEL -->
  <div class="dp-auth-left">
    <img src="../website/assets/logo.webp" alt="Thuvakkam Education" />
    <div class="dp-auth-left-title">Make a difference in a student's life.</div>
    <div class="dp-auth-left-sub">Your contribution to the Sponsor for Success programme goes directly towards scholarships, mentoring, and long-term support for students across Tamil Nadu.</div>
  </div>

  <!-- RIGHT PANEL -->
  <div class="dp-auth-right">
    <div class="dp-auth-form-card">
      <div>
        <div class="dp-auth-title">Choose a new password</div>
        <div class="dp-auth-sub">Enter a new password for your donor account.</div>
      </div>

      <div class="dp-auth-error"   id="reset-error"></div>
      <div class="dp-auth-success" id="reset-success"></div>

      <div class="dp-view" id="reset-fields">
        <div class="dp-field-group">
          <label class="dp-field-label">New password</label>
          <input class="dp-field-input" id="new-password" type="password" placeholder="Minimum 8 characters" autocomplete="new-password" />
        </div>
        <div class="dp-field-group">
          <label class="dp-field-label">Confirm password</label>
          <input class="dp-field-input" id="confirm-password" type="password" placeholder="Re-enter password" autocomplete="new-password" />
        </div>
        <button class="dp-auth-btn" id="submit-btn" onclick="setPassword()">Save new password</button>
      </div>

      <div class="dp-auth-link">
        <a href="index.html">← Back to sign in</a>
      </div>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
  const sb = supabase.createClient(
    'https://vftexybohuaxngyhwjts.supabase.co',
    'sb_publishable_vO20BiWyS_VIkhU2DDmw3g_BoGBeCdq'
  );

  const errEl     = document.getElementById('reset-error');
  const successEl = document.getElementById('reset-success');
  const fieldsEl  = document.getElementById('reset-fields');

  function showErr(msg) {
    errEl.textContent = msg;
    errEl.style.display = 'block';
  }

  // The reset link logs the donor in automatically (session comes from the URL).
  // If that didn't happen, the link is invalid, expired or already used.
  sb.auth.getSession().then(({ data: { session } }) => {
    if (!session) {
      fieldsEl.style.display = 'none';
      showErr('This link has expired or has already been used. Go back to sign in and choose "Forgot password?" to get a new one.');
    }
  });

  document.getElementById('confirm-password').addEventListener('keydown', e => {
    if (e.key === 'Enter') setPassword();
  });

  async function setPassword() {
    const password = document.getElementById('new-password').value;
    const confirm  = document.getElementById('confirm-password').value;
    const btn      = document.getElementById('submit-btn');

    errEl.style.display = 'none';

    if (!password || !confirm) { showErr('Please fill in both fields.'); return; }
    if (password.length < 8)   { showErr('Password must be at least 8 characters.'); return; }
    if (password !== confirm)  { showErr('Passwords do not match.'); return; }

    btn.disabled    = true;
    btn.textContent = 'Saving...';

    const { error } = await sb.auth.updateUser({ password });

    if (error) {
      showErr('Could not update password: ' + error.message);
      btn.disabled    = false;
      btn.textContent = 'Save new password';
      return;
    }

    fieldsEl.style.display = 'none';
    successEl.textContent  = 'Password updated! Taking you to your account...';
    successEl.style.display = 'block';
    setTimeout(() => window.location.href = 'index.html', 1200);
  }
</script>
</body>
</html>
