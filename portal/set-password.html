<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Set Your Password — Thuvakkam SFS Portal</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green-dark: #1E5C38;
      --green-mid:  #2D7A4F;
      --yellow:     #F5C31D;
      --white:      #FFFFFF;
      --cream:      #F7F6F0;
      --grey-100:   #EBEBEB;
      --grey-200:   #D8D8D8;
      --grey-400:   #9E9E9E;
      --grey-600:   #555555;
      --black:      #1A1A1A;
      --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      --radius-md: 6px;
      --radius-lg: 10px;
    }

    html, body { min-height: 100%; font-family: var(--font); font-size: 14px; color: var(--black); background: var(--cream); -webkit-font-smoothing: antialiased; }

    .wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 32px 16px; }
    .card { width: 100%; max-width: 400px; background: var(--white); border: 1px solid var(--grey-100); border-radius: var(--radius-lg); overflow: hidden; box-shadow: 0 4px 24px rgba(0,0,0,0.06); }
    .card-head { background: var(--green-dark); padding: 28px 28px 24px; }
    .card-head img { height: 44px; width: auto; display: block; margin-bottom: 14px; }
    .card-head-accent { width: 36px; height: 4px; background: var(--yellow); border-radius: 2px; margin-bottom: 14px; }
    .card-title { font-size: 20px; font-weight: 700; color: var(--white); letter-spacing: -0.01em; }
    .card-sub { font-size: 13px; color: rgba(255,255,255,0.65); margin-top: 6px; line-height: 1.5; }
    .card-body { padding: 26px 28px 28px; }

    .msg { display: none; border-radius: var(--radius-md); padding: 10px 14px; font-size: 13px; line-height: 1.5; margin-bottom: 16px; }
    .msg-error   { background: #FEE2E2; border: 1px solid #FCA5A5; color: #991B1B; }
    .msg-success { background: #D1FAE5; border: 1px solid #A7F3D0; color: #065F46; }

    .form-group { margin-bottom: 16px; }
    .form-label { display: block; font-size: 12px; font-weight: 600; color: var(--grey-600); margin-bottom: 7px; letter-spacing: 0.02em; }
    .form-input { width: 100%; background: var(--white); border: 1px solid var(--grey-200); border-radius: var(--radius-md); padding: 10px 14px; font-size: 14px; font-family: var(--font); outline: none; transition: border-color 0.15s, box-shadow 0.15s; }
    .form-input:focus { border-color: var(--green-mid); box-shadow: 0 0 0 3px rgba(45,122,79,0.1); }

    .btn { width: 100%; background: var(--green-dark); color: var(--white); border: none; border-radius: var(--radius-md); padding: 12px; font-size: 14px; font-weight: 600; font-family: var(--font); cursor: pointer; margin-top: 4px; }
    .btn:hover { background: var(--green-mid); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .back-link { display: none; text-align: center; font-size: 13px; color: var(--green-mid); font-weight: 600; text-decoration: none; margin-top: 4px; }
    .hint { font-size: 12px; color: var(--grey-400); text-align: center; margin-top: 18px; }
  </style>
</head>
<body>

  <div class="wrap">
    <div class="card">
      <div class="card-head">
        <img src="assets/logo.webp" alt="Thuvakkam Education" />
        <div class="card-head-accent"></div>
        <div class="card-title" id="page-title">Set Your Password</div>
        <div class="card-sub" id="page-sub">Welcome to the SFS committee portal. Choose a password to activate your account.</div>
      </div>

      <div class="card-body">
        <div class="msg msg-error"   id="err"></div>
        <div class="msg msg-success" id="ok"></div>

        <div id="form-fields">
          <div class="form-group">
            <label class="form-label" for="new-password">New password</label>
            <input class="form-input" id="new-password" type="password" placeholder="Minimum 8 characters" autocomplete="new-password" />
          </div>
          <div class="form-group">
            <label class="form-label" for="confirm-password">Confirm password</label>
            <input class="form-input" id="confirm-password" type="password" placeholder="Re-enter password" autocomplete="new-password" />
          </div>
          <button class="btn" id="submit-btn" onclick="setPassword()">Set password &amp; continue</button>
        </div>

        <a href="./" class="back-link" id="back-link">&larr; Go to sign in</a>

        <p class="hint">Having trouble? Ask the person who added you to send a new link from the Team page.</p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script>
    // A reset link arrives with type=recovery in the address; a new-admin invite has type=invite.
    const isReset = window.location.hash.includes('type=recovery');

    const sb = supabase.createClient(
      'https://vftexybohuaxngyhwjts.supabase.co',
      'sb_publishable_vO20BiWyS_VIkhU2DDmw3g_BoGBeCdq'
    );

    const errEl    = document.getElementById('err');
    const okEl     = document.getElementById('ok');
    const fieldsEl = document.getElementById('form-fields');

    function showErr(msg) {
      errEl.textContent = msg;
      errEl.style.display = 'block';
    }

    let btnLabel = 'Set password & continue';
    let doneMsg  = 'Password set! Taking you to the portal...';
    if (isReset) {
      document.getElementById('page-title').textContent = 'Choose a New Password';
      document.getElementById('page-sub').textContent   = 'Enter a new password for your committee portal account.';
      btnLabel = 'Save new password';
      doneMsg  = 'Password updated! Taking you to the portal...';
      document.getElementById('submit-btn').textContent = btnLabel;
    }

    // The emailed link logs the person in automatically (the session comes from the URL).
    // If that didn't happen, the link is invalid, expired or already used.
    sb.auth.getSession().then(({ data: { session } }) => {
      if (!session) {
        fieldsEl.style.display = 'none';
        showErr('This link has expired or has already been used. Ask an admin to send you a new one from the Team page.');
        document.getElementById('back-link').style.display = 'block';
      }
    });

    document.getElementById('confirm-password').addEventListener('keydown', e => {
      if (e.key === 'Enter') setPassword();
    });

    async function setPassword() {
      const password = document.getElementById('new-password').value;
      const confirm  = document.getElementById('confirm-password').value;
      const btn      = document.getElementById('submit-btn');

      errEl.style.display = 'none';

      if (!password || !confirm) { showErr('Please fill in both fields.'); return; }
      if (password.length < 8)   { showErr('Password must be at least 8 characters.'); return; }
      if (password !== confirm)  { showErr('Passwords do not match.'); return; }

      btn.disabled    = true;
      btn.textContent = 'Saving...';

      const { error } = await sb.auth.updateUser({ password });

      if (error) {
        showErr('Could not set password: ' + error.message);
        btn.disabled    = false;
        btn.textContent = btnLabel;
        return;
      }

      fieldsEl.style.display = 'none';
      okEl.textContent  = doneMsg;
      okEl.style.display = 'block';
      setTimeout(() => window.location.href = 'dashboard.html', 1200);
    }
  </script>
</body>
</html>
