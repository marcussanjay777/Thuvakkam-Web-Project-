<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Set Your Password — Thuvakkam SFS</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="sp-login-wrap">
    <div class="sp-login-card">

      <div class="sp-login-head">
        <img src="../website/assets/logo.webp" alt="Thuvakkam Education" />
        <div class="sp-login-head-title" id="page-title">Set Your Password</div>
        <div class="sp-login-head-sub" id="page-sub">Welcome to the SFS Scholarship Program.<br/>Choose a password to activate your account.</div>
      </div>

      <div class="sp-login-body">
        <div class="sp-login-error"   id="login-error"></div>
        <div class="sp-login-success" id="login-success"></div>

        <div id="form-fields">
          <div class="sp-field-group">
            <label class="sp-field-label">New password</label>
            <input class="sp-field-input" id="new-password" type="password" placeholder="Minimum 8 characters" autocomplete="new-password" />
          </div>
          <div class="sp-field-group" style="margin-top:14px;">
            <label class="sp-field-label">Confirm password</label>
            <input class="sp-field-input" id="confirm-password" type="password" placeholder="Re-enter password" autocomplete="new-password" />
          </div>

          <button class="sp-login-btn" id="submit-btn" style="margin-top:20px;" onclick="setPassword()">
            Set password &amp; continue
          </button>
        </div>

        <a href="./" class="sp-forgot-link" id="back-link" style="display:none;">← Back to sign in</a>

        <p class="sp-login-hint">
          Having trouble? Contact <strong>info@thuvakkam.org</strong>
        </p>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script>
    // A password-reset link arrives with type=recovery in the address; an admin invite has type=invite.
    const isReset = window.location.hash.includes('type=recovery');

    const sb = supabase.createClient(
      'https://vftexybohuaxngyhwjts.supabase.co',
      'sb_publishable_vO20BiWyS_VIkhU2DDmw3g_BoGBeCdq'
    );

    const errEl     = document.getElementById('login-error');
    const successEl = document.getElementById('login-success');
    const fieldsEl  = document.getElementById('form-fields');

    function showErr(msg) {
      errEl.textContent = msg;
      errEl.style.display = 'block';
    }

    let btnLabel = 'Set password & continue';
    let doneMsg  = 'Password set! Taking you to your portal...';
    if (isReset) {
      document.getElementById('page-title').textContent = 'Choose a New Password';
      document.getElementById('page-sub').textContent   = 'Enter a new password for your account.';
      btnLabel = 'Save new password';
      doneMsg  = 'Password updated! Taking you to your portal...';
      document.getElementById('submit-btn').textContent = btnLabel;
    }

    // The invite or reset link logs the user in automatically (session comes from the URL).
    // If that didn't happen, the link is invalid, expired or already used.
    sb.auth.getSession().then(({ data: { session } }) => {
      if (!session) {
        fieldsEl.style.display = 'none';
        showErr('This link has expired or has already been used. If you were resetting your password, go back to sign in and choose "Forgot password?" to get a new link. New students: please contact your SFS coordinator.');
        document.getElementById('back-link').style.display = 'block';
      }
    });

    document.getElementById('confirm-password').addEventListener('keydown', e => {
      if (e.key === 'Enter') setPassword();
    });

    async function setPassword() {
      const password = document.getElementById('new-password').value;
      const confirm   = document.getElementById('confirm-password').value;
      const btn       = document.getElementById('submit-btn');

      errEl.style.display = 'none';

      if (!password || !confirm) { showErr('Please fill in both fields.'); return; }
      if (password.length < 8)   { showErr('Password must be at least 8 characters.'); return; }
      if (password !== confirm)  { showErr('Passwords do not match.'); return; }

      btn.disabled    = true;
      btn.textContent = 'Setting password...';

      const { error } = await sb.auth.updateUser({ password });

      if (error) {
        showErr('Could not set password: ' + error.message);
        btn.disabled    = false;
        btn.textContent = btnLabel;
        return;
      }

      fieldsEl.style.display = 'none';
      successEl.textContent  = doneMsg;
      successEl.style.display = 'block';
      setTimeout(() => window.location.href = 'profile.html', 1200);
    }
  </script>
</body>
</html>
